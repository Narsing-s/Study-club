name: Manual Vercel Deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-manual-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Ensure production deploys come from main
        if: inputs.target == 'production'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deployments can only be started from the main branch."
            exit 1
          fi

      - name: Check required Vercel configuration
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing VERCEL_TOKEN secret."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing VERCEL_ORG_ID repository variable."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing VERCEL_PROJECT_ID repository variable."; exit 1; }

      - name: Checkout selected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d17a4e2c5b3b6a8b8b0b8f8e6f7 # v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link the Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="${{ inputs.target }}"

      - name: Build for production
        if: inputs.target == 'production'
        run: vercel build --prod

      - name: Build preview
        if: inputs.target == 'preview'
        run: vercel build

      - name: Deploy production
        if: inputs.target == 'production'
        run: vercel deploy --prebuilt --prod --yes

      - name: Deploy preview
        if: inputs.target == 'preview'
        run: vercel deploy --prebuilt --yes
